# Default: self-contained demo mode.
db.driver=${DB_DRIVER:org.h2.Driver}
db.url=${DB_URL:jdbc:h2:mem:erp_portfolio;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
db.username=${DB_USERNAME:sa}
db.password=${DB_PASSWORD:}

# Mock Salesforce is used unless the Spring profile "salesforce" is activated.
crm.api-version=${CRM_API_VERSION:v61.0}
crm.token-url=${CRM_TOKEN_URL:https://login.salesforce.com/services/oauth2/token}
crm.client-id=${CRM_CLIENT_ID:}
crm.client-secret=${CRM_CLIENT_SECRET:}
crm.product-object=${CRM_PRODUCT_OBJECT:Portfolio_Product__c}
crm.product-external-id=${CRM_PRODUCT_EXTERNAL_ID_FIELD:External_Id__c}
crm.customer-object=${CRM_CUSTOMER_OBJECT:Portfolio_Customer__c}
crm.customer-external-id=${CRM_CUSTOMER_EXTERNAL_ID_FIELD:External_Id__c}
crm.order-object=${CRM_ORDER_OBJECT:Portfolio_Order__c}
crm.order-external-id=${CRM_ORDER_EXTERNAL_ID_FIELD:External_Id__c}
crm.delivery-object=${CRM_DELIVERY_OBJECT:Portfolio_Delivery__c}
crm.delivery-external-id=${CRM_DELIVERY_EXTERNAL_ID_FIELD:External_Id__c}
